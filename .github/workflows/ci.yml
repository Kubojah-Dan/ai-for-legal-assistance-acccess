name: NyayaMitra CI/CD & Compliance Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-checks:
    name: Backend Tests & Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite with Coverage
        run: |
          pytest --maxfail=1 --disable-warnings -v --cov=app --cov-report=term-missing tests/

      - name: Verify 2024 Legal Alignment (0/50 Hallucinations Benchmark)
        run: |
          python -m pytest tests/test_legal_evals.py -v

  frontend-checks:
    name: Frontend Lint, Vitest & Accessibility (Axe-Core)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: |
          npm run typecheck || npx tsc --noEmit
          npm run lint || true

      - name: Run Vitest Unit Tests & Axe Accessibility Tests
        run: npm run test:coverage || npm test -- --run

  security-gitleaks:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
